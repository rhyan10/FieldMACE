[metadata]
name = fieldmace
version = attr: mace.__version__
description = FieldMACE: MACE for QM/MM - equivariant ML potentials for a QM region embedded in MM point charges, with an OpenMM ML/MM interface.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/rhyan10/FieldMACE
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    License :: OSI Approved :: MIT License

[options]
packages = find:
python_requires = >=3.10
install_requires =
    torch>=2.1
    e3nn==0.5.1
    numpy
    scipy
    opt_einsum
    opt_einsum_fx
    ase>=3.23
    torch-ema
    torchmetrics
    prettytable
    matscipy
    h5py
    tqdm
    configargparse
    python-hostlist
    # for plotting:
    matplotlib
    pandas

[options.packages.find]
exclude =
    tests
    tests.*
    scripts
    scripts.*
    examples
    examples.*

[options.package_data]
mace = calculators/foundations_models/*.model

[options.entry_points]
console_scripts =
    mace_active_learning_md  =  mace.cli.active_learning_md:main
    mace_create_lammps_model  =  mace.cli.create_lammps_model:main
    mace_eval_configs  =  mace.cli.eval_configs:main
    mace_plot_train  =  mace.cli.plot_train:main
    mace_run_train  =  mace.cli.run_train:main
    mace_preprocess_data  =  mace.cli.preprocess_data:main

[options.extras_require]
mlmm =
    openmm>=8.3
test =
    pytest
    openmmtools
    openmm>=8.3
wandb = wandb
schedulefree = schedulefree
