# Pushing a tag vX.Y.Z builds the sdist and wheel and publishes them to PyPI.
# One-time setup on pypi.org: add a "trusted publisher" for the project fieldmace
# (owner rhyan10, repository FieldMACE, workflow release.yml, environment pypi).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches mace/__version__.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "exec(open('mace/__version__.py').read()); print(__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
