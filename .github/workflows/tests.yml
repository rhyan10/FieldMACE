name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip:
    name: pip, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[mlmm,test]"
      - name: Tests (SHARC tests are skipped without $SHARC)
        env:
          OMP_NUM_THREADS: 2
        run: pytest -q tests --durations=15

  openmm-torch:
    name: conda-forge, openmm-torch (TorchForce backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment-openmm-torch.yml
          cache-environment: true
      - name: Install FieldMACE
        run: pip install -e . --no-deps
      - name: Tests
        env:
          OMP_NUM_THREADS: 2
        run: pytest -q tests/mlmm/test_torchforce.py tests/test_diabatic.py tests/mlmm/test_active_learning.py

  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install build twine
          python -m build
          twine check dist/*
